[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "droiddeck"
version = "0.5.1"
description = "Cross-platform front-end for running Android apps (APK) via the Waydroid container on Linux."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "DroidDeck contributors" }]
keywords = ["android", "apk", "waydroid", "container"]
dependencies = ["PySide6>=6.5"]

[project.scripts]
droiddeck = "droiddeck.__main__:main"

[project.gui-scripts]
droiddeck-gui = "droiddeck.__main__:main"

[tool.setuptools.packages.find]
include = ["droiddeck*"]

[tool.setuptools.package-data]
droiddeck = ["assets/*", "assets/**/*"]
