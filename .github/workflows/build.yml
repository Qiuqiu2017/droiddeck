name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: droiddeck-linux-x86_64
          - os: windows-latest
            artifact: droiddeck-windows-x86_64
          - os: macos-latest
            artifact: droiddeck-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6>=6.5" pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/droiddeck.spec

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -C dist -czf "${{ matrix.artifact }}.tar.gz" droiddeck

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/droiddeck -DestinationPath "${{ matrix.artifact }}.zip"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
